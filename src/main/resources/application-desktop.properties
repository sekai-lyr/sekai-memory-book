spring.datasource.url=jdbc:h2:file:${sekai.desktop.data-dir:./data}/sekai-memory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-desktop.sql
spring.h2.console.enabled=false

server.port=18083
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
server.servlet.session.cookie.name=JSESSIONID_M3_DESKTOP

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

mybatis.mapper-locations=classpath*:com.sekai.memory.book.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

sekai.desktop.open-browser=true
