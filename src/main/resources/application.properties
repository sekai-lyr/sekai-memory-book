spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

# 鍏ㄥ眬缂栫爜閰嶇疆
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 鏈嶅姟绔彛
server.port=8083

# 鍙拌瘝瑙嗛涓婁紶
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# MyBatis閰嶇疆
mybatis.mapper-locations=classpath*:com.sekai.memory.book.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Session timeout - 2 hours (in case of inactivity)
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M3
