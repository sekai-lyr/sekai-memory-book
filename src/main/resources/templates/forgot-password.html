<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Memory Book - 找回密码</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#9b3ee8">
</head>
<body>
<main class="login-page recovery-page">
    <section class="brand-area">
        <div class="brand-title">
            <h1>Sekai Memory Book</h1>
            <p>番剧回忆录</p>
        </div>
        <div class="brand-slogan">
            <p>用绑定手机号验证身份。</p>
            <p>验证成功后会生成新的临时密码，旧密码不会被明文显示。</p>
        </div>
    </section>

    <section class="form-area">
        <div class="login-card">
            <div class="card-header">
                <div class="flower">Sakura</div>
                <h2>找回密码</h2>
                <p>手机号验证码验证</p>
            </div>

            <div class="server-message success" th:if="${message}" th:text="${message}"></div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>

            <div class="server-message success" th:if="${resetUserName != null && resetTempPassword != null}">
                <div>用户名：<strong th:text="${resetUserName}">sekai</strong></div>
                <div>临时密码：<strong th:text="${resetTempPassword}">Sekai@000000</strong></div>
            </div>

            <form th:action="@{/forgot-password/send-code}" action="/forgot-password/send-code" method="post">
                <div class="form-group">
                    <label for="phoneNumber">手机号</label>
                    <div class="input-box">
                        <span class="input-icon">PH</span>
                        <input type="tel" id="phoneNumber" name="phoneNumber" th:value="${phoneNumber}" placeholder="请输入绑定手机号" autocomplete="tel" required>
                    </div>
                </div>
                <button type="submit" class="register-btn">获取验证码</button>
            </form>

            <form th:action="@{/forgot-password/reset}" action="/forgot-password/reset" method="post">
                <div class="form-group">
                    <label for="resetPhoneNumber">手机号</label>
                    <div class="input-box">
                        <span class="input-icon">PH</span>
                        <input type="tel" id="resetPhoneNumber" name="phoneNumber" th:value="${phoneNumber}" placeholder="请输入绑定手机号" autocomplete="tel" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="code">验证码</label>
                    <div class="input-box">
                        <span class="input-icon">VC</span>
                        <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">生成临时密码</button>
            </form>

            <a th:href="@{/login}" href="/login" class="register-btn">返回登录</a>
        </div>
    </section>

    <footer class="page-footer">
        © 2026 Sekai Memory Book
        <span>|</span>
        私人回忆收藏馆
    </footer>
</main>
<script src="/js/pwa.js"></script>
</body>
</html>
